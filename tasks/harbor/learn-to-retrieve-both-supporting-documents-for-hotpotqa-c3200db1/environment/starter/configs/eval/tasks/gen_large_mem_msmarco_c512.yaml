# MS MARCO corpus eval @ 512 docs for the hard-neg (think) run. Reports llm_judge_accuracy +
# lexical_grounding + mem_pos_weight_mass + doc_access_acc/doc_hit_rate/doc_token_hit_rate.
#
# Corpus sizing follows the *_grd pattern, NOT embed_corpus_1000's: max_docs stays null so the
# doc generator yields the FULL corpus for the gold scan (data/documents.py stops the generator at
# max_docs, so capping it there would silently drop every gold doc sitting past the cap), and
# target_docs trims the final bank to 512 = all query golds + distractors. With
# max_chunks_per_doc=1, 512 docs == 512 chunks.
defaults:
  - /eval@eval: generation_large_mem
  - /dataset@dataset: qa
  - /dataset/sources@dataset: msa_msmarco_v1_qa
  - /dataset@eval.doc_dataset: documents
  - /dataset/sources@eval.doc_dataset: msa_msmarco_v1_docs
  - _self_

eval:
  num_samples: 128
  output_file: outputs/msmarco_c512.json
  max_new_tokens: 512
  doc_access_acc: true
  inject_query_gold: true
  metrics:
    llm_judge_accuracy: {}
    lexical_grounding: {}
  doc_dataset:
    max_docs: null
    target_docs: 512
    max_chunks_per_doc: 1
    chunk_size: 256

dataset:
  split: train
  seq_len: 512
  doc_chunk_seq_len: 256
  num_chunks_per_doc: 1
  num_workers: 0
  force_thinking: true
  provide_docs: true
  # 8, not 16: the full-corpus generation forward is what pushed msmarco ~2.1G over HBM at bs=16
  # on a v6e-8 (ground_eval_box.py) — same corpus and same num_samples, just a smaller gen batch.
  batch_size: 8
  shuffle: false
