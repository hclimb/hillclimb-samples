# Optimizer-aware group-wise data regularization with LoRA fine-tuning
method: OptimizerAwareGroupWise
finetuning: LoRA
learning_rate: 1.00e-04
lora_r: 8
lora_alpha: 16
lora_dropout: 0.1

scoring:
  method: reduced_ghost

optimizer:
  type: adamw

optimizer_aware:
  matrix_geometry: muon
  vector_geometry: adamw
  muon_reference: momentum_proxy
  muon_momentum: 0.95
  muon_steps: 5
  muon_max_dim: 256
  spectral_lambda: 0.0
