defaults:
  - /eval@eval: generation_large_mem
  - /dataset@dataset: qa
  - /dataset/sources@dataset: hotpotqa_distractor_with_ids
  - /dataset@eval.doc_dataset: documents
  - /dataset/sources@eval.doc_dataset: hotpotqa_distractor_docs
  - _self_

eval:
  num_samples: 500
  output_file: outputs/hotpotqa_distractor.json
  max_new_tokens: 512
  metrics:
    llm_judge_accuracy: {}
  doc_access_acc: true
  doc_dataset:
    max_docs: null
    max_chunks_per_doc: 4

dataset:
  split: train
  seq_len: 1024
  doc_chunk_seq_len: 256
  num_chunks_per_doc: 8
  num_workers: 0
  force_thinking: true
  batch_size: 64

rag:
  doc_dataset: ${oc.env:HF_USERNAME}/hotpotqa-distractor-docs-validation
  query_dataset: RUC-NLPIR/FlashRAG_datasets
  query_hf_config: hotpotqa
  query_split: dev
  query_column: question
  query_gt_column: golden_answers
  num_queries: 64
  gen_model: Qwen/Qwen3-4B
  gen_tensor_parallel_size: 4
  judge_model: Qwen/Qwen3-4B
  judge_tensor_parallel_size: 4
