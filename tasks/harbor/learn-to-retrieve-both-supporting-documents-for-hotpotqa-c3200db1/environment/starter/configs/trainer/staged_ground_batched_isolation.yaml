# `staged_ground` (see staged_ground.yaml) with doc_access_loss swapped for
# doc_access_per_query_loss in both stages -- same reasoning as
# staged_batched_isolation.yaml (staged.yaml's sibling for the 4-stage recipe): doc_access_loss
# needs aux_data["mem_scores"] as the FULL CROSS-BATCH grid, which mem_lookup_batched
# (model.memory.mem_batched_isolation=true) structurally never builds, so under that mode it
# silently no-ops. See wiki/implementations/2026-08-02-hard-neg-full-efficient-retrieval.md.
#
# staged_ground.yaml's base-level `aux_losses` (the full weight-0 telemetry block) is NOT
# overridden here -- only `training_stages` is -- so it carries through via normal dict-merge
# inheritance (only LISTS replace wholesale in OmegaConf, not the whole config). Telemetry stays
# on, same as the parent.
#
# staged_ground.yaml itself is left untouched -- shared by non-batched-isolation grounding
# recipes that doc_access_loss is exactly right for.
defaults:
  - staged_ground
  - _self_

training_stages:
  - trainable_params: [".*mem_.*"]
    max_step: 1000
    ce_weight: 1.0
    learning_rate: 1e-4
    warmup_frac: 0.1
    aux_losses:
      doc_access_loss:
        enabled: false
      doc_access_per_query_loss:
        enabled: true
        weight: 0.1
        temperature: 1.0

  - trainable_params: [".*mem_.*", ".*embed_model.*", ".*value_model.*"]
    max_step: ${trainer.steps}
    ce_weight: 1.0
    learning_rate: 2e-4
    lr_schedule: cosine
    warmup_frac: 0.005
    aux_losses:
      doc_access_loss:
        enabled: false
      doc_access_per_query_loss:
        enabled: true
        weight: 0.1
        temperature: 1.0
