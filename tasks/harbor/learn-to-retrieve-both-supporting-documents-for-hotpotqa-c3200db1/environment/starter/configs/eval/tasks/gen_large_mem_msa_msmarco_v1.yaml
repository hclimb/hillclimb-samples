# MS MARCO v1 — 7.34M tokens corpus
defaults:
  - /eval@eval: generation_large_mem
  - /dataset@dataset: qa
  - /dataset/sources@dataset: msa_msmarco_v1_qa
  - /dataset@eval.doc_dataset: documents
  - /dataset/sources@eval.doc_dataset: msa_msmarco_v1_docs
  - _self_

eval:
  type: generation_large_mem_msa
  num_samples: 128
  output_file: outputs/msa_msmarco_v1.json
  max_new_tokens: 512
  metrics:
    llm_judge_accuracy: {}
    lexical_grounding: {}
  doc_dataset:
    max_docs: null
    max_chunks_per_doc: 1
    chunk_size: 256

dataset:
  split: train
  seq_len: 512
  doc_chunk_seq_len: 256
  num_chunks_per_doc: 1
  num_workers: 0
  force_thinking: true
  provide_docs: true
  batch_size: 16
  shuffle: false

rag:
  doc_dataset: ${oc.env:HF_USERNAME}/msa-msmarco-v1-docs-with-ids
  query_dataset: ${oc.env:HF_USERNAME}/msa-msmarco-v1-qa-with-ids
  query_column: question
  query_gt_column: answer
  num_queries: 128
