# Variant A on combined_hard_neg_sft4b — same dataset the model was SFT'd on
# (triviaqa/hotpotqa/nq/squad/msmarco mix with vm2825 hard negs). Because the
# dataset guarantees min_neg_docs=2, my swap's argmax(~pos_mask) picks a real
# hard-neg chunk (docs_mask=1) rather than falling back to a padded slot. So
# the swap does a proper pos → hard-neg replacement (same semantics as L3C),
# not a pos → padding mask-out.
#
# Uses split=validation (real held-out) at pool=512 (batch=32, chunks=16).
defaults:
  - /eval@eval: swap_logit_delta
  - /dataset@dataset: qa
  - /dataset/sources@dataset: combined_hard_neg_sft4b
  - _self_

eval:
  eval_steps: 50
dataset:
  split: validation
  seq_len: 512
  doc_chunk_seq_len: 256
  num_chunks_per_doc: 16
  num_workers: 0
  provide_docs: true
  batch_size: 32
  shuffle: false
