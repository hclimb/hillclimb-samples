# Independent per-layer subsets from the Muon singular-mode surrogate.
method: LayerWiseMuonSpectral
finetuning: Full
learning_rate: 1.00e-05
selection_mode: topk
use_second_order: false
subset_mode: one_pass

scoring:
  method: reduced_ghost

optimizer:
  type: hybrid

optimizer_aware:
  target_mode: opta
  matrix_geometry: auto
  vector_geometry: adamw

muon_surrogate:
  alpha: 1.0
  rank: 32
  full_svd_max_dim: 256
  rtol: 1e-6
  oversample: 8
  power_iters: 2
