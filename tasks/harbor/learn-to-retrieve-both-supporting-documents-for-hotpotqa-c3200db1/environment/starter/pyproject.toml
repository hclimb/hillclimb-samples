[project]
name = "memory-layers"
version = "0.1.0"
dependencies = [
    "cmake==4.3.0",
    "jax[tpu]==0.8.0",
    "jaxlib",
    "jax-smi",
    "libtpu",
    "numpy",
    "safetensors",
    "huggingface_hub",
    "transformers==4.57.6",
    "optax",
    "tqdm",
    "wandb",
    "datasets>=4.3.0",
    "fsspec>=2025.9.0",
    "jinja2",
    "grain>=0.2.15",
    "orbax-checkpoint>=0.11.32",
    "torch>=2.9.0",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "python-dotenv",
    "vllm-tpu==0.12.0",
    # NOTE: vllm-tpu 0.12.0 HTTP judge server breaks with the fastapi/starlette/
    # prometheus-fastapi-instrumentator versions it resolves to
    # (_IncludedRouter has no attribute 'path'). For JUDGING only, install
    # fastapi==0.115.6 starlette==0.41.3 prometheus-fastapi-instrumentator==7.0.0
    # and launch vllm via `uv run --no-sync` (see evals/vllm.py). Do NOT pin them
    # here — that conflicts with vllm-tpu's starlette>=0.49.1 and breaks `uv run`.
    "ijson>=3.5.0",
    "google-cloud-tpu",
    "google-cloud-storage",
    "rich",
    "fire",
    "openai",
    "gcsfs>=2026.2.0",
    "gdown>=5.1.0",
    "sparqlwrapper>=2.0.0",
    "mwxml>=0.3.3",
    "mwparserfromhell>=0.6.6",
    "matplotlib>=3.10.8",
    "wonderwords>=2.2.0",
]
requires-python = ">=3.11"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["models", "data"]

[tool.uv]
override-dependencies = [
    "transformers==4.57.6",
]
