# Grounding Stage 3: span/neighbor value readout (stacks on Stage 2 K/V split).
# When slot t is retrieved, also pull values of t±span_window and mean-pool (respecting doc
# boundaries), so the answer token rides in even when the match keyed on a cue/context token.
# Identical to Stage 2 except span_window > 0. See grounding plan Stage 3.
name: qwen3_mem_embed
trainable_params: [".*mem_.*", ".*embed_model.*", ".*value_model.*"]

main_model:
  model_id: Qwen/Qwen3-4B
  load_weights: true

memory:
  mem_layers: [9, 14, 20, 27]
  mem_size: 16384
  mem_num_heads: 4
  mem_k_dim: 1024
  mem_v_dim: 1024
  mem_top_k: 128
  mem_use_product_keys: false
  mem_placement: "after_attention"
  mem_use_gating: false
  mem_lookup_chunk_size: null
  two_pass_topk: false
  mem_collect_full_scores: true
  mem_o_proj_zero_init: true
  span_window: 0                 # TEMP 2026-07-04: span_readout produced NaN grad norms (s3 only,
                                 # s2 clean) -> disabled for overnight so s3 trains; DEBUG span_readout
                                 # (likely the sharded window-gather backward) + re-enable to 1.

embed_model:
  model_id: Qwen/Qwen3-Embedding-0.6B
  load_weights: true
  lora:
    enabled: false
    params: [".*gate_proj", ".*up_proj", ".*down_proj"]
    rank: 256
    alpha: 256
  mask_type: 'bidirectional'
  embed_conv: true
  embed_conv_kernel_size: 1
  embed_conv_stride: 1

value_model:
  model_id: Qwen/Qwen3-0.6B-Base
  load_weights: true
  lora:
    enabled: false
    params: [".*gate_proj", ".*up_proj", ".*down_proj"]
    rank: 256
    alpha: 256
  mask_type: 'bidirectional'
