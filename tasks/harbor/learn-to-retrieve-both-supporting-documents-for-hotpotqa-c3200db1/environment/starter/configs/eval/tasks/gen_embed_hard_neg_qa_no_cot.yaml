defaults:
  - /eval@eval: generation_embed
  - /dataset@dataset: qa
  - /dataset/sources@dataset: science_qa_hard_neg_no_cot
  - _self_

eval:
  num_examples: 32
  max_new_tokens: 128
  metrics:
    llm_judge_accuracy: {}
dataset:
  split: validation
  seq_len: 128
  doc_chunk_seq_len: 256
  num_chunks_per_doc: 16
  min_neg_docs: 2
  
  num_workers: 0
  force_thinking: false
