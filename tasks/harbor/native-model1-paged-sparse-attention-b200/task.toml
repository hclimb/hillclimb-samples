schema_version = "1.3"

artifacts = [
  { source = "/environment/starter", destination = "final_app", exclude = [
    ".git",
    ".git/**",
    "build",
    "build/**",
    "**/__pycache__",
    "**/*.pyc",
    "**/*.so",
    "**/.pytest_cache",
    "**/.ruff_cache",
    "**/*.egg-info",
  ] },
]

[task]
name = "hillclimb/native-model1-paged-sparse-attention-b200"
description = "Optimize fixed-workload native MODEL1 attention on one B200: batch128, query length3, heads128, 128+1024 selected entries, 32k positions per cache region. Reward anchors warmed estimated dense-BF16 roofline efficiency at zero for the calibrated starter and one for the estimated roofline. All original settings remain correctness gates."
keywords = ["cuda", "blackwell", "sparse-attention", "fp8", "batched-throughput"]

[[task.authors]]
name = "Hillclimb"
email = "enterprise@hillclimb.com"

[metadata]
difficulty = "hard"
category = "coding"
tags = ["optifine", "optimization", "cuda", "blackwell", "sparse-attention", "fp8", "batched-throughput"]
description = """Optimize fixed-workload native MODEL1 attention on one B200: batch128, query length3, heads128, 128+1024 selected entries, 32k positions per cache region. Reward anchors warmed estimated dense-BF16 roofline efficiency at zero for the calibrated starter and one for the estimated roofline. All original settings remain correctness gates."""
estimated_time_minutes = 360
primary_metric = "estimated_dense_bf16_roofline"
package_id = "approved-plan"

[verifier]
timeout_sec = 3600.0
environment_mode = "separate"
network_mode = "no-network"

[agent]
timeout_sec = 21600.0
network_mode = "no-network"

[environment]
build_timeout_sec = 3600.0
cpus = 16
memory_mb = 131072
storage_mb = 40960
gpus = 1
gpu_types = ["B200"]
network_mode = "public"
workdir = "/environment/starter"

[verifier.environment]
build_timeout_sec = 3600.0
cpus = 16
memory_mb = 131072
storage_mb = 40960
gpus = 1
gpu_types = ["B200"]
network_mode = "no-network"
workdir = "/environment/starter"
