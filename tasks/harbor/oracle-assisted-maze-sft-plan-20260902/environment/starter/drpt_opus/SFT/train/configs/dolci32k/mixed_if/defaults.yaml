# Dolci Mixed-32K -> the exact same Precise-IF target as inst_if.
experiment_profile: dolci32k
setting_id: mixed_if
model_profile: qwen3_1_7b
method_config_dir: configs/dolci32k_methods
train_dataset: mixed_32k
target_task: precise_if
percentage: 1.0
seed: 42
batch_size: 16
gradient_accumulation_steps: 1
optim: adamw_torch
learning_rate: 1.0e-5
muon_learning_rate: 3.0e-4
aux_adamw_learning_rate: 1.0e-5
max_seq_length: 4096
lr_scheduler_type: linear
warmup_ratio: 0.03
weight_decay: 0.0
num_train_epochs: 1
eval_steps: 100
use_flash_attention: true
gradient_checkpointing: true
tf32: true
dataloader_drop_last: true
n_eval: 512
n_target_val: 128
selection_frac: 0.5
selection_mode: topk
n_val: 64
val_batch_size: 2
val_strategy: separate_batch
val_seq_length_multiplier: 0
logical_candidate_batch_size: 16
candidate_microbatch_size: 2
target_microbatch_size: 2
target_cache_device: cuda
target_cache_pin_memory: false
record_selections: true
record_selections_freq: 100
optimizer_aware_diagnostic_interval: 0
scoring:
  method: reduced_ghost
