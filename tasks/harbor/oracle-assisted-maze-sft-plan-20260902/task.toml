schema_version = "1.3"

artifacts = [
  { source = "/environment/starter", destination = "final_app", exclude = [
    ".git",
    ".git/**",
    "build",
    "build/**",
    "**/__pycache__",
    "**/*.pyc",
    "**/*.so",
    "**/.pytest_cache",
    "**/.ruff_cache",
    "**/*.egg-info",
  ] },
]

[task]
name = "hillclimb/oracle-assisted-maze-sft-plan-20260902"
description = "Optimize fixed-budget supervised fine-tuning of a fixed maze policy by selecting and weighting evaluator-cataloged gold, alternative, recovery, prefix, and contrastive trajectory examples, scored by generated-path correctness and efficiency on unseen mazes."
keywords = ["machine-learning", "supervised-fine-tuning", "maze", "gpu"]

[[task.authors]]
name = "Hillclimb"
email = "enterprise@hillclimb.com"

[metadata]
difficulty = "hard"
category = "coding"
tags = ["optifine", "optimization", "machine-learning", "supervised-fine-tuning", "maze", "gpu"]
description = """Optimize fixed-budget supervised fine-tuning of a fixed maze policy by selecting and weighting evaluator-cataloged gold, alternative, recovery, prefix, and contrastive trajectory examples, scored by generated-path correctness and efficiency on unseen mazes."""
estimated_time_minutes = 360
primary_metric = "mean_generated_path_quality"
package_id = "oracle-assisted-maze-sft-plan-20260902"
plan_name = "oracle-assisted-maze-sft"

[verifier]
timeout_sec = 3600.0
environment_mode = "separate"
network_mode = "no-network"

[agent]
timeout_sec = 21600.0
network_mode = "no-network"

[environment]
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 32768
storage_mb = 20480
gpus = 1
gpu_types = ["H100"]
network_mode = "public"
workdir = "/environment/starter"

