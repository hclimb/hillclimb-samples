defaults:
  - standard

# Extended horizon: more data (QA + text-pair similarity), so the final-stage
# cosine decay is stretched to 150k steps (vs 100k historically).
steps: 150000
checkpoint_interval: 2000
eval_interval: 10000

training_stages:
  # Stage 0: Train memory + conv projection only, no CE (warmup)
  - trainable_params: [".*mem_.*", ".*embed_proj_conv.*"]
    max_step: 2000
    ce_weight: 0.0
    warmup_frac: 0.1
    aux_losses:
      doc_access_loss:
        weight: 0.1

  # Stage 1: Train memory + embed model
  - trainable_params: [".*mem_.*", ".*embed_model.*"]
    max_step: 4000
    ce_weight: 0.0
    warmup_frac: 0.1
    aux_losses:
      doc_access_loss:
        weight: 0.1

  # Stage 2: Introduce CE
  - trainable_params: [".*mem_.*", ".*embed_model.*"]
    max_step: 6000
    ce_weight: 1.0
    warmup_frac: 0.1
    aux_losses:
      doc_access_loss:
        weight: 0.1

  # Stage 3: Unfreeze main model. Peak LR only 1e-5 (protects the 4B),
  # short warmup then cosine decay over the extended horizon.
  - trainable_params: [".*mem_.*", ".*embed_model.*", ".*main_model.*"]
    max_step: ${trainer.steps}
    ce_weight: 1.0
    lr_schedule: cosine
    learning_rate: 1e-5
    warmup_frac: 0.005
    aux_losses:
      doc_access_loss:
        weight: 0.1
