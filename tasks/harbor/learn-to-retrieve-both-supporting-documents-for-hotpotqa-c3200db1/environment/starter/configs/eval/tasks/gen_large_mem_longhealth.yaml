# LongHealth: long clinical documents, small corpus -- the "few, long documents" regime.
#
# THROUGHPUT IS THE POINT, ACCURACY IS OOD. No checkpoint here was trained on documents this long
# (midtraining used 256-token MuSiQue paragraphs), so llm_judge_accuracy is an out-of-distribution
# number and is NOT a model-quality claim. It is reported because it is free and because
# doc_hit_rate -- retrieval, which IS comparable -- is only interpretable alongside it.
#
# CHUNKING. max_chunks_per_doc=32 caps a document at 8192 tokens. The longest LongHealth document
# is ~5,900 tokens, so this covers 100% of the corpus. The default of 4 (1024-token cap) would
# silently drop ~30% of the corpus tokens and quietly shrink the bank -- the exact silent-
# truncation failure this repo has been bitten by before.
defaults:
  - /eval@eval: generation_large_mem
  - /dataset@dataset: qa
  - /dataset/sources@dataset: longhealth_qa
  - /dataset@eval.doc_dataset: documents
  - /dataset/sources@eval.doc_dataset: longhealth_docs
  - _self_

eval:
  num_samples: 128
  output_file: outputs/longhealth.json
  max_new_tokens: 512
  doc_access_acc: true
  inject_query_gold: true
  metrics:
    llm_judge_accuracy: {}
    lexical_grounding: {}
  doc_dataset:
    max_docs: null
    target_docs: 133        # the entire LongHealth corpus -- there is no distractor pool beyond it
    max_chunks_per_doc: 32
    chunk_size: 256

dataset:
  split: train
  seq_len: 1024
  doc_chunk_seq_len: 256
  num_chunks_per_doc: 16    # gold docs per question runs 1..11; 16 leaves headroom
  num_workers: 0
  force_thinking: true
  provide_docs: true
  batch_size: 8
  shuffle: false
